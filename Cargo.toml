[package]
name = "callephiin"
version = "1.0.1"
edition = "2021"
description = "callephiin, a Windows-native Jellyfin desktop client"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui_extras = { version = "0.29", features = ["image", "http", "svg"] }
egui_glow = "0.29"
# egui_extras builds resvg without embedded-image support; enable it so SVGs that wrap a PNG render.
resvg = { version = "0.37", default-features = false, features = ["raster-images"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico"] }
libmpv2 = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-rich-presence = "0.2"
directories = "5"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
webbrowser = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[build-dependencies]
winresource = "0.1"
